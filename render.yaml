# Native Python deployment. No Docker, packaged datasets, or startup imports.
services:
  - type: web
    name: prime-chainsentinel-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: APP_ENV
        value: production
      - key: MARKET_DATA_PROVIDER
        value: yahoo
      - key: PCS_DEMO_USERNAME
        sync: false
      - key: PCS_DEMO_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
