name: prime-chainsentinel-defense

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: prime-chainsentinel:defense
    restart: unless-stopped
    ports:
      # Bind only to localhost; Cloudflare Tunnel provides remote access.
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      MARKET_DATA_PROVIDER: yahoo
      PCS_DB_PATH: /app/backend/storage/evidence.db
      PCS_DEMO_USERNAME: ${PCS_DEMO_USERNAME:?Set PCS_DEMO_USERNAME in root .env}
      PCS_DEMO_PASSWORD: ${PCS_DEMO_PASSWORD:?Set PCS_DEMO_PASSWORD in root .env}
    volumes:
      - pcs_storage:/app/backend/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pcs_storage:
    name: pcs-defense-storage
